<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комната видеосвязи</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; }
        .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        video { width: 45%; max-width: 500px; background: #000; border: 2px solid #444; border-radius: 10px; }
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2 id="roomTitle"></h2>

    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button onclick="start()">Подключиться</button>
        <button onclick="leave()">Выйти</button>
    </div>

<script>
const roomId = window.location.pathname.split("/").pop();
document.getElementById("roomTitle").innerText = "Комната: " + roomId;

let localStream;
let peerConnection;
let ws;
let isInitiator = false;

const iceServers = {
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

async function start() {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById("localVideo").srcObject = localStream;

    ws = new WebSocket(`ws://${window.location.host}/ws/${roomId}`);

    ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "init") {
            isInitiator = true;
            await createOffer();
        }

        if (msg.type === "offer") {
            await handleOffer(msg);
        }

        if (msg.type === "answer") {
            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(msg)
            );
        }

        if (msg.type === "ice") {
            if (peerConnection) {
                await peerConnection.addIceCandidate(
                    new RTCIceCandidate(msg.candidate)
                );
            }
        }

        if (msg.type === "user-left") {
            document.getElementById("remoteVideo").srcObject = null;
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
        }
    };
}

async function createPeerConnection() {
    peerConnection = new RTCPeerConnection(iceServers);

    localStream.getTracks().forEach(track =>
        peerConnection.addTrack(track, localStream)
    );

    peerConnection.ontrack = (event) => {
        document.getElementById("remoteVideo").srcObject = event.streams[0];
    };

    peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
            ws.send(JSON.stringify({
                type: "ice",
                candidate: event.candidate
            }));
        }
    };
}

async function createOffer() {
    await createPeerConnection();

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    ws.send(JSON.stringify({
        type: "offer",
        sdp: offer.sdp
    }));
}

async function handleOffer(offer) {
    await createPeerConnection();

    await peerConnection.setRemoteDescription(
        new RTCSessionDescription(offer)
    );

    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    ws.send(JSON.stringify({
        type: "answer",
        sdp: answer.sdp
    }));
}

function leave() {
    if (ws) ws.close();
    if (peerConnection) peerConnection.close();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    window.location.href = "/";
}
</script>
</body>
</html>
